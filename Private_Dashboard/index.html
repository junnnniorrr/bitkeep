        .shape {

            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 25s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            left: 80%;
            animation-delay: 5s;
            animation-duration: 30s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            left: 50%;
            animation-delay: 10s;
            animation-duration: 20s;
        }

        .shape:nth-child(4) {
            width: 100px;

            left: 20%;

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginButton = document.getElementById('login');
            const emailInput = document.getElementById('admin_user');
            const passwordInput = document.getElementById('admin_password');
            const loader = document.getElementById('loader');
            const cardBody = document.querySelector('.card-body');

            function validateEmail() {
                if (emailInput.value.trim() === '') {
                    emailInput.classList.add('is-invalid');
                    return false;
                } else {
                    emailInput.classList.remove('is-invalid');
                    return true;
                }
            }

            function validatePassword() {
                if (passwordInput.value === '') {
                    passwordInput.classList.add('is-invalid');
                    return false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                    return true;
                }
            }

            loginButton.addEventListener('click', function (event) {
                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();

                if (!isEmailValid || !isPasswordValid) {
                    event.preventDefault(); // Prevent form submission if validation fails
                    // Add shake animation to form
                    document.querySelector('.card').classList.add('shake');
                    setTimeout(() => {
                        document.querySelector('.card').classList.remove('shake');
                    }, 500);
                } else {
                    // Show loading
                    loader.style.display = 'block';
                    cardBody.style.opacity = '0.7';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        cardBody.style.opacity = '1';
                        // Form will submit naturally here
                    }, 1500);
                }
            });

            // Real-time validation
            emailInput.addEventListener('blur', validateEmail);
            passwordInput.addEventListener('blur', validatePassword);
            
            emailInput.addEventListener('input', function() {
                if (emailInput.classList.contains('is-invalid')) {
                    validateEmail();
                }
            });
            
            passwordInput.addEventListener('input', function() {
                if (passwordInput.classList.contains('is-invalid')) {
                    validatePassword();
                }
            });
        });
    </script>
